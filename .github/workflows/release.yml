name: Release Gajae Code App

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified draft after all final checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-policy:
    name: Validate protected release ref
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "Releases may only be dispatched from refs/heads/main." >&2
            exit 1
          fi

  build:
    name: Build Node 22 Linux x64 server artifact
    needs: release-policy
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: x64
          cache: npm

      - name: Define canonical release asset
        id: metadata
        run: |
          set -euo pipefail
          case "$(node --version)" in
            v22.*) ;;
            *) echo "Node 22 is required." >&2; exit 1 ;;
          esac
          case "$(getconf GNU_LIBC_VERSION)" in
            "glibc 2.35") ;;
            *) echo "The release artifact must be built on glibc 2.35." >&2; exit 1 ;;
          esac
          VERSION="$(node -p "require('./package.json').version")"
          ASSET_NAME="gajae-app-server-${VERSION}-linux-x64-node22.tar.gz"
          {
            echo "artifact_name=$ASSET_NAME"
            echo "release_tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Seed verified ripgrep install cache
        run: node scripts/release/prime-ripgrep-cache.mjs

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned Bun runtime
        run: node scripts/fetch-bun.mjs

      - name: Verify source
        run: npm run verify


      - name: Build server artifact
        run: npm run server:bundle

      - name: Stage and verify canonical release assets
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release/server/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one generated server archive." >&2
            exit 1
          fi
          source_archive="${archives[0]}"
          if [ "$(basename "$source_archive")" != "$ASSET_NAME" ]; then
            echo "Generated archive name does not match canonical release asset: $source_archive" >&2
            exit 1
          fi
          source_checksum="${source_archive}.sha256"
          test -f "$source_checksum"
          (
            cd "$(dirname "$source_archive")"
            sha256sum --check "$(basename "$source_checksum")"
          )

          mkdir release-assets
          cp "$source_archive" "release-assets/$ASSET_NAME"
          (
            cd release-assets
            sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
            sha256sum --check "$ASSET_NAME.sha256"
          )

          assets=(release-assets/*)
          if [ "${#assets[@]}" -ne 2 ] ||
             [ ! -f "release-assets/$ASSET_NAME" ] ||
             [ ! -f "release-assets/$ASSET_NAME.sha256" ]; then
            echo "Release staging must contain only the canonical archive and checksum." >&2
            exit 1
          fi

      - name: Smoke extracted server artifact
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir extracted
          tar -xzf "release-assets/$ASSET_NAME" -C extracted
          test -f extracted/package.json
          expected_version="${ASSET_NAME#gajae-app-server-}"
          expected_version="${expected_version%-linux-x64-node22.tar.gz}"
          actual_version="$(node -p "require('./extracted/package.json').version")"
          test "$actual_version" = "$expected_version"
          node extracted/scripts/gajae-app-runtime.mjs --help

      - name: Upload canonical server release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gajae-app-server-release
          path: release-assets/*
          if-no-files-found: error

  desktop-macos:
    name: Build macOS arm64 desktop DMG
    needs: release-policy
    timeout-minutes: 90
    runs-on: macos-14
    # Published desktop assets require Developer ID signing and notarization.
    # Local ad-hoc builds remain available through the packaging scripts.
    # See scripts/release/SIGNING-READINESS.md for read-only readiness checks.
    environment: release
    permissions:
      contents: read
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      GAJAE_UPDATER_PUBLIC_KEY: ${{ vars.GAJAE_UPDATER_PUBLIC_KEY }}
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      signed: ${{ steps.identity.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: arm64
          cache: npm

      - name: Define canonical desktop release asset
        id: metadata
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          case "$(node --version)" in
            v22.*) ;;
            *) echo "Node 22 is required." >&2; exit 1 ;;
          esac
          RELEASE_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./package.json').desktopVersion")"
          ASSET_NAME="gajae-app-desktop-${RELEASE_VERSION}-macos-arm64.dmg"
          {
            echo "artifact_name=$ASSET_NAME"
            echo "desktop_version=$DESKTOP_VERSION"
            echo "release_tag=v$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Require release signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/release/check-signing-readiness.mjs --mode ci
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          test -n "${GAJAE_UPDATER_PUBLIC_KEY:-}"

      - name: Install and verify Minisign 0.12
        run: |
          set -euo pipefail
          brew install minisign
          test "$(minisign -v)" = "minisign 0.12"

      - name: Prepare updater public key and reviewed source notes
        run: |
          set -euo pipefail
          PUBLIC_KEY_FILE="$RUNNER_TEMP/gajae-updater.pub"
          NOTES_FILE="$RUNNER_TEMP/gajae-release-notes.txt"
          printf '%s' "$GAJAE_UPDATER_PUBLIC_KEY" > "$PUBLIC_KEY_FILE"
          chmod 600 "$PUBLIC_KEY_FILE"
          git show -s --format=%B "$GITHUB_SHA" > "$NOTES_FILE"
          chmod 600 "$NOTES_FILE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "GAJAE_UPDATER_PUBLIC_KEY_FILE=$PUBLIC_KEY_FILE"
            echo "GAJAE_RELEASE_NOTES_FILE=$NOTES_FILE"
          } >> "$GITHUB_ENV"

      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustup target add aarch64-apple-darwin
          rustc --version

      - name: Seed verified ripgrep install cache
        run: node scripts/release/prime-ripgrep-cache.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and verify embedded macOS server payload
        run: npm run server:payload:macos

      - name: Import the Developer ID certificate into a throwaway keychain
        id: identity
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/gajae-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make cleanup run even if unlock/import/identity selection fails.
          echo "GAJAE_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -oE '"Developer ID Application: [^"]+"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "The imported certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing as: $IDENTITY"

      - name: Build Tauri app bundle (Tauri's own ad-hoc pass)
        # This bundle becomes the signed updater archive, so it must compile the
        # production updater in. The public key is repository configuration,
        # not a secret; the build fails if it is absent or not the pinned key.
        env:
          GJC_UPDATE_MODE: production
          GJC_UPDATE_FEED_ORIGIN: https://api.github.com
          GJC_UPDATE_PUBKEY: ${{ vars.GJC_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          test -n "${GJC_UPDATE_PUBKEY:-}" || { echo "Repository variable GJC_UPDATE_PUBKEY is required for an updater release." >&2; exit 1; }
          env -u CI npm run tauri -- build --bundles app
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Gajae Code App.app"
          test "$("$APP/Contents/MacOS/gajae-app-desktop" --desktop-build-info | node -pe 'JSON.parse(require("fs").readFileSync(0)).updateMode')" = production

      - name: Sign the bundle with the Developer ID
        if: steps.identity.outputs.signed == 'true'
        run: npm run desktop:sign:macos

      - name: Notarize and staple the app
        if: steps.identity.outputs.signed == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Gajae Code App.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/gajae-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/gajae-app.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 60m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -t exec -vv "$APP"

      - name: Build canonical installable DMG
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_tag }}
        run: npm run desktop:dmg:macos -- --artifact-version "${RELEASE_VERSION#v}"

      - name: Notarize and staple the DMG
        if: steps.identity.outputs.signed == 'true'
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          set -euo pipefail
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/$ASSET_NAME"
          codesign -dv --verbose=2 "$DMG" 2>&1 | grep -q 'Authority=Developer ID Application' || {
            echo "The DMG is not signed with the Developer ID; APPLE_SIGNING_IDENTITY did not reach the DMG step." >&2
            exit 1
          }
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 60m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # Stapling changes the image; the checksum has to be of what ships.
          (cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      - name: Build canonical macOS updater assets
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.artifact_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Gajae Code App.app"
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/$ASSET_NAME"
          PUB_DATE="$(date -u -r "$(git show -s --format=%ct "$GITHUB_SHA")" +%Y-%m-%dT%H:%M:%SZ)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/release/make-macos-updater.mjs \
            --app "$APP" \
            --dmg "$DMG" \
            --output "$RUNNER_TEMP/gajae-macos-assets" \
            --commit "$GITHUB_SHA" \
            --team-id "$APPLE_TEAM_ID" \
            --updater-public-key-file "$GAJAE_UPDATER_PUBLIC_KEY_FILE" \
            --notes-file "$GAJAE_RELEASE_NOTES_FILE" \
            --pub-date "$PUB_DATE"

      - name: Smoke the app installed from the DMG
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.artifact_name }}
          DESKTOP_VERSION: ${{ steps.metadata.outputs.desktop_version }}
          SIGNED: ${{ steps.identity.outputs.signed }}
        run: |
          set -euo pipefail
          MOUNT_POINT="$RUNNER_TEMP/gajae-app-dmg"
          mkdir "$MOUNT_POINT"
          hdiutil attach "$RUNNER_TEMP/gajae-macos-assets/$ASSET_NAME" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT"' EXIT
          APP="$MOUNT_POINT/Gajae Code App.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          # What the user's Finder does: copy the app to a writable volume and
          # verify it there. A seal that only holds on the read-only mount is
          # the one that says "damaged" after install (file names outside ASCII
          # come back from an HFS+ image with different bytes than were sealed).
          COPIED="$RUNNER_TEMP/gajae-app-copy/Gajae Code App.app"
          mkdir -p "$(dirname "$COPIED")"
          ditto "$APP" "$COPIED"
          codesign --verify --deep --strict "$COPIED"
          if [ "$SIGNED" = "true" ]; then
            xcrun stapler validate "$APP"
            spctl -a -t exec -vv "$APP" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
            xcrun stapler validate "$COPIED"
            spctl -a -t exec -vv "$COPIED" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          fi
          rm -rf "$RUNNER_TEMP/gajae-app-copy"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = "app.gajae.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$DESKTOP_VERSION"
          lipo "$APP/Contents/MacOS/gajae-app-desktop" -verify_arch arm64
          lipo "$APP/Contents/MacOS/gajae-app-server" -verify_arch arm64
          node scripts/release/smoke-packaged-server.mjs --tauri-app "$APP"
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

      - name: Upload canonical desktop release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gajae-app-desktop-release
          path: ${{ runner.temp }}/gajae-macos-assets/*
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && env.GAJAE_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$GAJAE_SIGNING_KEYCHAIN"

  ubuntu-24-compatibility:
    name: Smoke server artifact on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: x64

      - name: Download canonical server release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gajae-app-server-release
          path: release-assets

      - name: Verify checksum and smoke extracted artifact
        env:
          ASSET_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -ne 2 ] ||
             [ ! -f "release-assets/$ASSET_NAME" ] ||
             [ ! -f "release-assets/$ASSET_NAME.sha256" ]; then
            echo "Compatibility job received non-canonical release assets." >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check "$ASSET_NAME.sha256"
          )
          mkdir extracted
          tar -xzf "release-assets/$ASSET_NAME" -C extracted
          test -f extracted/package.json
          expected_version="${ASSET_NAME#gajae-app-server-}"
          expected_version="${expected_version%-linux-x64-node22.tar.gz}"
          actual_version="$(node -p "require('./extracted/package.json').version")"
          test "$actual_version" = "$expected_version"
          node extracted/scripts/gajae-app-runtime.mjs --help
          (
            cd extracted
            node -e "const Database=require('better-sqlite3'); const pty=require('node-pty'); const db=new Database(':memory:'); db.exec('select 1'); db.close(); const child=pty.spawn(process.execPath,['-e','process.exit(0)']); child.onExit(() => process.exit(0)); setTimeout(() => process.exit(1),5000)"
            node -e "const {spawnSync}=require('node:child_process'); const rg=require('@vscode/ripgrep').rgPath; const result=spawnSync(rg,['--version'],{stdio:'inherit'}); process.exit(result.status ?? 1)"
          )
          export HOME="$RUNNER_TEMP/gajae-app-home"
          mkdir -p "$HOME"
          SERVER_PORT=39001 HOST=127.0.0.1 node extracted/scripts/gajae-app-runtime.mjs start >"$RUNNER_TEMP/gajae-app-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:39001/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:39001/health
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

  publish:
    name: Publish GitHub Release
    needs:
      - build
      - desktop-macos
      - ubuntu-24-compatibility
    runs-on: macos-14
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Require signed desktop before publication
        env:
          DESKTOP_SIGNED: ${{ needs.desktop-macos.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$DESKTOP_SIGNED" != "true" ]; then
            echo "Refusing to publish a desktop artifact without the signing and notarization lane." >&2
            exit 1
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: arm64
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install and verify Minisign 0.12
        run: |
          set -euo pipefail
          brew install minisign
          test "$(minisign -v)" = "minisign 0.12"

      - name: Prepare updater public key
        env:
          GAJAE_UPDATER_PUBLIC_KEY: ${{ vars.GAJAE_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${GAJAE_UPDATER_PUBLIC_KEY:-}"
          PUBLIC_KEY_FILE="$RUNNER_TEMP/gajae-updater.pub"
          printf '%s' "$GAJAE_UPDATER_PUBLIC_KEY" > "$PUBLIC_KEY_FILE"
          chmod 600 "$PUBLIC_KEY_FILE"
          echo "GAJAE_UPDATER_PUBLIC_KEY_FILE=$PUBLIC_KEY_FILE" >> "$GITHUB_ENV"

      - name: Download canonical server release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gajae-app-server-release
          path: release-assets

      - name: Download canonical desktop release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gajae-app-desktop-release
          path: release-assets

      - name: Verify publish inputs
        env:
          SERVER_ASSET_NAME: ${{ needs.build.outputs.artifact_name }}
          DESKTOP_ASSET_NAME: ${{ needs.desktop-macos.outputs.artifact_name }}
          SERVER_RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          DESKTOP_RELEASE_TAG: ${{ needs.desktop-macos.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$SERVER_RELEASE_TAG" != "$DESKTOP_RELEASE_TAG" ]; then
            echo "Server and desktop release tags do not match." >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -ne 8 ] ||
             [ ! -f "release-assets/$SERVER_ASSET_NAME" ] ||
             [ ! -f "release-assets/$SERVER_ASSET_NAME.sha256" ] ||
             [ ! -f "release-assets/$DESKTOP_ASSET_NAME" ]; then
            echo "Refusing to publish non-canonical release assets." >&2
            exit 1
          fi
          VERSION="${SERVER_RELEASE_TAG#v}"
          for asset in \
            "gajae-app-desktop-${VERSION}-macos-arm64.dmg" \
            "gajae-app-desktop-${VERSION}-macos-arm64.dmg.sha256" \
            "gajae-app-desktop-${VERSION}-macos-arm64.app.tar.gz" \
            "gajae-app-desktop-${VERSION}-macos-arm64.app.tar.gz.sig" \
            "gajae-app-desktop-${VERSION}-macos-arm64.app.tar.gz.sha256" \
            "desktop-update.json"; do
            test -f "release-assets/$asset"
          done

      - name: Verify, stage and publish the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${APPLE_TEAM_ID:-}"
          publish_args=()
          if [[ "$RELEASE_PUBLISH" == "true" ]]; then
            publish_args+=(--publish)
          fi
          node scripts/release/ci-release.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --team-id "$APPLE_TEAM_ID" \
            --assets-dir release-assets \
            --updater-public-key-file "$GAJAE_UPDATER_PUBLIC_KEY_FILE" \
            "${publish_args[@]}"

      # A release created with GITHUB_TOKEN does not raise `release: published`,
      # so a separate notification workflow listening for that event never runs.
      # The lane that publishes announces.
      - name: Announce the release
        if: ${{ inputs.publish == true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SERVER_ASSET_NAME: ${{ needs.build.outputs.artifact_name }}
          DESKTOP_ASSET_NAME: ${{ needs.desktop-macos.outputs.artifact_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "No DISCORD_WEBHOOK_URL secret configured; skipping the announcement."
            exit 0
          fi
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          jq -n \
            --arg title "Gajae Code App $RELEASE_TAG" \
            --arg url "$release_url" \
            --arg description "$(printf '%s\n%s' "$DESKTOP_ASSET_NAME" "$SERVER_ASSET_NAME")" \
            '{embeds: [{title: $title, url: $url, description: $description, color: 2105893}]}' \
            | curl --fail-with-body --silent --show-error \
                --header 'Content-Type: application/json' \
                --data @- "$DISCORD_WEBHOOK_URL"
